name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # The Cloudflare deploy, without deploying: catches a bad wrangler.jsonc,
      # a missing build output or a broken Worker on every pull request.
      - run: pnpm deploy:check

  pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # `train` brings SimpleITK, so the NIfTI geometry tests run rather than skip.
      - run: uv sync --extra dev --extra train --locked
      - run: uv run pytest
      # The committed tutorial case must be what the phantom builds today.
      - run: uv run ctrr phantom
      - name: Tutorial case is up to date
        run: git diff --exit-code -- ../web/public/cases/phantom-01
