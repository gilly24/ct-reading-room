[project]
name = "ctrr"
version = "0.1.0"
description = "CT Reading Room case pipeline: turns CT DICOM + DICOM SEG into cases the web app can load."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "pydicom>=3.0",
  "highdicom>=0.29",
  "idc-index>=0.13",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ctrr = "ctrr.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ctrr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
